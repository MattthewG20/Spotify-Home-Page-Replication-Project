<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Spotify Homepage where you can browse, listen, and search all your beloved songs!">

        <title>Spotify | Home Page</title>

        <link rel="stylesheet" href="/global.css" type="text/css">
    </head>

    <body>
        <nav>
            <div>
                <img id="spotifylogo" src="Spotify/Images/logos/spotify-logo.png" alt="Spotify Logo">
            </div>

            <div id="homebutton">
                <img class="Nav-icon" src="Spotify/Images/Icons/home-icon.png" alt="Home Icon">
            </div>

            <div id="searchbar">
                <img id="searchicon" class="Nav-icon" src="Spotify/Images/Icons/search-icon.png" alt="Search Icon">
                <p>What do you want to play?</p>

                <p id="searchbar-divider">|</p>

                <img id="laundryicon" class="Nav-icon" src="Spotify/Images/Icons/laundry-basket-icon.png" alt="laundry Basket Icon">
            </div>

            <div id="Nav-right">
                    <h3 class="righttext">Premium</h3>
                    <h3 class="righttext">Support</h3>
                    <h3 class="righttext">Download</h3>

                <h3 id="Nav-rightdivider">|</h3>

                <img id="downloadbutton" class="Nav-icon" src="Spotify/Images/Icons/download-icon.png" alt="Download Icon">
                <h3 class="righttext">Install App</h3>
                <h3 class="righttext">Sign up</h3>

                <div id="login">
                    <p>Log in</p>
                </div>
            </div>
        </nav>
        <header>

        </header>
        <aside>

        </aside>
        <main>

        </main>
        <footer>

        </footer>
    </body>
</html>
